name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches build version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - name: Build MSI
        shell: bash
        run: ./gradlew packageMsi --no-daemon
      - name: Checksum
        shell: bash
        run: |
          cd build/compose/binaries/main/msi
          for f in *.msi; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" build/compose/binaries/main/msi/* --title "${GITHUB_REF_NAME}" --generate-notes
