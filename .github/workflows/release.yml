name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check tag matches build version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' build.gradle.kts)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - name: Test
        shell: bash
        run: ./gradlew test --no-daemon
      - name: Build MSI
        shell: bash
        run: ./gradlew packageMsi --no-daemon
      - name: Checksum
        shell: bash
        run: |
          cd build/compose/binaries/main/msi
          for f in *.msi; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: build/compose/binaries/main/msi/*
          if-no-files-found: error

  publish:
    needs: windows-msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: msi
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" msi/* --title "${GITHUB_REF_NAME}" --generate-notes
