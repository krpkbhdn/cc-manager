name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        run: ./gradlew test --no-daemon
