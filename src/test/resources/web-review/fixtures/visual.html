<!doctype html>
<html><head><title>visual</title><style>
body { margin: 0; font: 14px sans-serif; background: #fff7e6 }
.outer { margin: 20px; padding: 18px; border: 3px solid #2f6f9f; border-radius: 28px; background: #cfe8ff }
.card { margin: 12px 0; padding: 14px; border: 2px solid #b45309; border-radius: 16px; background: #ffd9a8 }
.pill { display: inline-block; margin: 6px; padding: 6px 14px; border: 1px solid #166534; border-radius: 999px; background: #b7f0c4 }
.row { display: flex; gap: 16px; padding: 8px; background: #ffe1e1; border-radius: 10px }
.row div { width: 110px; height: 36px; background: #fbb; border-bottom: 3px solid #a00; border-radius: 12px 4px 12px 4px }
.hashed { padding: 6px; background: #e9d5ff; border-radius: 8px; margin-top: 8px }
</style></head><body>
<div class="outer" id="outer">
  <div class="card" id="c1"><span class="pill">alpha</span><span class="pill">beta</span></div>
  <div class="card" id="c2"><span class="pill">gamma</span></div>
  <div class="row"><div></div><div></div><div></div></div>
  <div class="css-1a2b3c hashed" id="h1"><span id="inner">hashed one</span></div>
  <div class="css-1a2b3c hashed" id="h2"><span>hashed two</span></div>
</div>
</body></html>
